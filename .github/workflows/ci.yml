name: CI
 
on:
  push:
    branches: [main]     
  pull_request:
 
jobs:
  test:
    name: chessEngine JUnit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chessEngine
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
 
      - name: Run tests
        run: ./mvnw -B --no-transfer-progress test
